<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Восстановление пароля — BOT_MAX</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        background: rgba(26,32,44,0.85);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 40px 36px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 8px; font-size: 1.5em; }
    .subtitle { color: #a0aec0; font-size: 0.9em; margin-bottom: 28px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9em; color: #cbd5e0; }
    input[type=email] {
        width: 100%; padding: 12px 14px; border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.05);
        color: #e2e8f0; font-size: 1em;
        margin-bottom: 18px;
    }
    input[type=email]:focus { outline: none; border-color: #667eea; }
    button {
        width: 100%; padding: 13px; border: 0; border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff; font-size: 1em; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg {
        margin-top: 18px; padding: 12px 14px; border-radius: 10px;
        font-size: 0.9em; display: none;
    }
    .msg.ok    { background: rgba(72,187,120,0.15); border: 1px solid #48bb78; color: #9ae6b4; display: block; }
    .msg.err   { background: rgba(245,101,101,0.15); border: 1px solid #f56565; color: #fc8181; display: block; }
    .msg.dev   { background: rgba(102,126,234,0.15); border: 1px solid #667eea; color: #a3bffa; display: block; word-break: break-all; }
    a.back { display: inline-block; margin-top: 20px; color: #a0aec0; font-size: 0.9em; text-decoration: none; }
    a.back:hover { color: #e2e8f0; }
</style>
</head>
<body>
<div class="card">
    <h1>🔑 Восстановление пароля</h1>
    <p class="subtitle">Введите email, привязанный к вашему аккаунту. Если аккаунт существует, мы отправим ссылку для сброса пароля.</p>

    <form id="forgotForm" autocomplete="on">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@clinic.ru" required autofocus>
        <button type="submit" id="submitBtn">Отправить ссылку</button>
    </form>

    <div id="msg" class="msg"></div>

    <a href="login.html" class="back">← Назад ко входу</a>
</div>

<script src="auth.js"></script>
<script>
(function () {
    'use strict';
    var form = document.getElementById('forgotForm');
    var emailEl = document.getElementById('email');
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');

    function show(kind, text) {
        msg.className = 'msg ' + kind;
        msg.textContent = text;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = (emailEl.value || '').trim().toLowerCase();
        if (!email) return;

        btn.disabled = true;
        btn.textContent = 'Отправка…';
        msg.className = 'msg';

        fetch('/api/auth/password-reset/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        }).then(function (res) {
            return res.json().then(function (d) { return { ok: res.ok, data: d }; });
        }).then(function (r) {
            btn.disabled = false;
            btn.textContent = 'Отправить ссылку';

            if (!r.ok) {
                show('err', (r.data && r.data.error) || 'Ошибка запроса');
                return;
            }
            show('ok', 'Если такой email зарегистрирован, мы отправили ссылку для сброса.');

            if (r.data && r.data.token) {
                var link = 'reset_password.html?token=' + encodeURIComponent(r.data.token);
                setTimeout(function () {
                    show('dev', 'DEV: ' + link);
                }, 800);
            }
        }).catch(function () {
            btn.disabled = false;
            btn.textContent = 'Отправить ссылку';
            show('err', 'Сервер недоступен. Проверьте соединение.');
        });
    });
})();
</script>
</body>
</html>
