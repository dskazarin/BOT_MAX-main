<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доктора — BOT_MAX</title>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }

        .container { max-width: 1600px; margin: 0 auto; }

        .back-link {
            display: inline-block;
            color: #a0aec0;
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .back-link:hover { color: #fff; }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo {
            font-size: 2em;
            background: linear-gradient(135deg, #9f7aea, #667eea);
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .header-title h1 { font-size: 1.3em; color: #fff; }
        .header-title small { color: #a0aec0; font-size: 0.8em; }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-info    { background: #4299e1; color: #fff; }
        .btn-danger  { background: #e53e3e; color: #fff; }
        .btn-success { background: #38a169; color: #fff; }
        .btn-warning { background: #d69e2e; color: #1a202c; }
        .btn-secondary { background: #4a5568; color: #e2e8f0; }
        .btn-sm { padding: 5px 10px; font-size: 0.8em; border-radius: 8px; }

        .toolbar {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: #cbd5e0;
            cursor: pointer;
        }
        .toolbar input[type=checkbox] {
            width: 16px; height: 16px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .table-wrap {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            vertical-align: top;
        }
        th { color: #a0aec0; font-weight: 600; user-select: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }
        td.mono { font-family: 'Consolas', monospace; font-size: 0.85em; color: #cbd5e0; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            font-family: 'Consolas', monospace;
        }
        .badge-active   { background: rgba(56, 161, 105, 0.2); color: #9ae6b4; }
        .badge-inactive { background: rgba(229, 62, 62, 0.2);  color: #fc8181; }
        .badge-role-doctor     { background: rgba(102, 126, 234, 0.2); color: #a3bffa; }
        .badge-role-admin      { background: rgba(214, 158, 46, 0.2);  color: #fbd38d; }
        .badge-role-superadmin { background: rgba(159, 122, 234, 0.2); color: #d6bcfa; }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #2d3748;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 25px 30px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal h2 { font-size: 1.2em; color: #fff; margin-bottom: 20px; }
        .modal .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .modal .field label { font-size: 0.85em; color: #a0aec0; }
        .modal .field input, .modal .field select {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
            color: #e2e8f0;
            font-size: 0.95em;
        }
        .modal .field input:focus, .modal .field select:focus { outline: 1px solid #667eea; }
        .modal .field small { color: #718096; font-size: 0.78em; }
        .modal .actions {
            display: flex; justify-content: flex-end; gap: 10px;
            margin-top: 10px;
        }
        .alert-error {
            display: none;
            background: rgba(229, 62, 62, 0.15);
            border: 1px solid rgba(229, 62, 62, 0.4);
            color: #fc8181;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .alert-error.show { display: block; }
        .alert-top {
            display: none;
            background: rgba(229, 62, 62, 0.15);
            border: 1px solid rgba(229, 62, 62, 0.4);
            color: #fc8181;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .alert-top.show { display: block; }
        .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .modal .check-row {
            display: flex; align-items: center; gap: 8px;
            color: #cbd5e0; font-size: 0.95em;
            margin-bottom: 15px;
        }
        .modal .check-row input { width: 16px; height: 16px; accent-color: #667eea; }
        .empty { text-align: center; color: #718096; padding: 40px; font-style: italic; }
        .error { color: #fc8181; padding: 20px; text-align: center; }
        .count { color: #a0aec0; font-size: 0.85em; margin-left: 10px; }
    </style>
</head>
<body>
<script>
// B15.1: страница только для admin/superadmin (по шаблону B13.1)
(function(){
    if (typeof BotMaxAuth === "undefined") {
        window.location.replace("login.html");
        return;
    }
    if (!BotMaxAuth.isLoggedIn()) {
        window.location.replace("login.html");
        return;
    }
    if (!BotMaxAuth.isAdmin()) {
        window.location.replace("doctor_cabinet.html");
        return;
    }
})();
</script>

<div class="container">
    <a href="admin_panel.html" class="back-link">⬅ Назад в панель</a>

    <div class="header">
        <div class="header-left">
            <div class="logo">👨⚕️</div>
            <div class="header-title">
                <h1>Доктора</h1>
                <small>Управление учётными записями BOT_MAX</small>
            </div>
        </div>
        <div>
            <button class="btn btn-info" onclick="loadDoctors()">🔄 Обновить</button>
            <a href="admin_panel.html" class="btn btn-secondary">↩ В панель</a>
        </div>
    </div>

    <div class="toolbar">
        <label>
            <input id="fIncludeInactive" type="checkbox" onchange="loadDoctors()">
            Показать неактивных
        </label>
        <button class="btn btn-success" id="btnAddDoctor" onclick="openCreateModal()">➕ Добавить доктора</button>
    </div>

    <div class="alert-top" id="topError"></div>

    <div class="table-wrap">
        <div class="count" id="countLabel"></div>
        <table>
            <thead>
                <tr>
                    <th style="width:110px">ID</th>
                    <th style="width:200px">Email</th>
                    <th>Имя</th>
                    <th style="width:110px">Роль</th>
                    <th style="width:160px">Специальность</th>
                    <th style="width:140px">Телефон</th>
                    <th style="width:100px">Активен</th>
                    <th style="width:160px">Создан</th>
                    <th style="width:160px">Последний вход</th>
                    <th style="width:200px">Действия</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="9" class="empty">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>

    <div class="modal-overlay" id="modalCreate">
        <div class="modal">
            <h2>➕ Новый доктор</h2>
            <div class="alert-error" id="createError"></div>
            <div class="field">
                <label for="cEmail">Email *</label>
                <input id="cEmail" type="email" placeholder="doctor@example.com" autocomplete="off">
            </div>
            <div class="field">
                <label for="cPassword">Пароль *</label>
                <input id="cPassword" type="password" placeholder="не менее 6 символов" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="cName">Имя *</label>
                <input id="cName" type="text" placeholder="Иванов Иван">
            </div>
            <div class="field">
                <label for="cSpecialty">Специальность</label>
                <input id="cSpecialty" type="text" placeholder="lor" value="lor">
                <small>По умолчанию: lor</small>
            </div>
            <div class="field">
                <label for="cRole">Роль</label>
                <select id="cRole">
                    <option value="doctor" selected>doctor</option>
                    <option value="admin" id="optRoleAdmin" hidden>admin</option>
                    <option value="superadmin" id="optRoleSuper" hidden>superadmin</option>
                </select>
                <small id="roleHint">Роль admin/superadmin доступна только superadmin.</small>
            </div>
            <div class="field">
                <label for="cPhone">Телефон</label>
                <input id="cPhone" type="text" placeholder="+7 900 000-00-00">
            </div>
            <div class="actions">
                <button class="btn btn-secondary" onclick="closeCreateModal()">✖ Отмена</button>
                <button class="btn btn-success" id="btnCreateSubmit" onclick="submitCreate()">✅ Создать</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalEdit">
        <div class="modal">
            <h2>✏️ Редактирование доктора</h2>
            <div class="alert-error" id="editError"></div>
            <div class="field">
                <label>ID</label>
                <input id="eId" type="text" disabled>
            </div>
            <div class="field">
                <label for="eName">Имя</label>
                <input id="eName" type="text">
            </div>
            <div class="field">
                <label for="eSpecialty">Специальность</label>
                <input id="eSpecialty" type="text">
            </div>
            <div class="field">
                <label for="ePhone">Телефон</label>
                <input id="ePhone" type="text">
            </div>
            <div class="check-row">
                <input id="eActive" type="checkbox">
                <label for="eActive">Активен</label>
            </div>
            <div class="actions">
                <button class="btn btn-secondary" onclick="closeEditModal()">✖ Отмена</button>
                <button class="btn btn-success" id="btnEditSubmit" onclick="submitEdit()">✅ Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function roleClass(role) {
    if (!role) return '';
    return 'badge-role-' + String(role).toLowerCase();
}

function renderRows(rows) {
    var tbody = document.getElementById('tbody');
    var count = document.getElementById('countLabel');

    if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty">Пусто — докторов нет</td></tr>';
        count.textContent = 'Найдено: 0';
        return;
    }
    var me = (typeof BotMaxAuth.getDoctor === 'function') ? BotMaxAuth.getDoctor() : null;
    var myId = me && me.id ? me.id : '';
    var iAmSuper = (typeof BotMaxAuth.isSuperadmin === 'function') && BotMaxAuth.isSuperadmin();

    // B18: defense-in-depth — admin не должен видеть admin/superadmin.
    // Backend (/api/doctors) уже фильтрует, дублируем на UI от регрессий.
    if (!iAmSuper) {
        rows = rows.filter(function (r) { return r.role === 'doctor'; });
    }

    var html = '';
    for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var activeBadge = r.active
            ? '<span class="badge badge-active">да</span>'
            : '<span class="badge badge-inactive">нет</span>';
        var isSelf = (r.id === myId);
        var isSuperTarget = (r.role === 'superadmin');
        var blockedBySuper = isSuperTarget && !iAmSuper;
        var canMutate = !isSelf && !blockedBySuper;

        var actions = '<div class="row-actions">';
        actions += '<button class="btn btn-sm btn-warning" onclick="openEditModal(\'' + escapeHtml(r.id) + '\')">✏️</button>';
        // B20: impersonation «глазами доктора» — только superadmin,
        // только active-доктор, не сам себя.
        if (iAmSuper && r.active && !isSelf && r.role === 'doctor') {
            actions += '<button class="btn btn-sm btn-info" title="Войти как" onclick="impersonate(\'' + escapeHtml(r.id) + '\')">👁</button>';
        }
        if (canMutate) {
            if (r.active) {
                actions += '<button class="btn btn-sm btn-danger" onclick="toggleActive(\'' + escapeHtml(r.id) + '\', false)">🚫</button>';
            } else {
                actions += '<button class="btn btn-sm btn-success" onclick="toggleActive(\'' + escapeHtml(r.id) + '\', true)">✅</button>';
            }
            actions += '<button class="btn btn-sm btn-danger" onclick="confirmDelete(\'' + escapeHtml(r.id) + '\', \'' + escapeHtml(r.email) + '\')">🗑️</button>';
        }
        actions += '</div>';

        html += '<tr>';
        html += '<td class="mono">' + escapeHtml(r.id) + '</td>';
        html += '<td class="mono">' + escapeHtml(r.email) + '</td>';
        html += '<td>' + escapeHtml(r.name) + '</td>';
        html += '<td><span class="badge ' + roleClass(r.role) + '">' + escapeHtml(r.role) + '</span></td>';
        html += '<td>' + escapeHtml(r.specialty) + '</td>';
        html += '<td class="mono">' + escapeHtml(r.phone) + '</td>';
        html += '<td>' + activeBadge + '</td>';
        html += '<td class="mono">' + escapeHtml(r.created) + '</td>';
        html += '<td class="mono">' + escapeHtml(r.lastLogin) + '</td>';
        html += '<td>' + actions + '</td>';
        html += '</tr>';
    }
    tbody.innerHTML = html;
    count.textContent = 'Найдено: ' + rows.length;
}

function loadDoctors() {
    var includeInactive = document.getElementById('fIncludeInactive').checked;
    var url = '/api/doctors' + (includeInactive ? '?include_inactive=1' : '');
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '<tr><td colspan="10" class="empty">Загрузка…</td></tr>';

    BotMaxAuth.authFetch('GET', url).then(function (res) {
        if (!res.ok) {
            tbody.innerHTML = '<tr><td colspan="9" class="error">Ошибка ' + res.status + '</td></tr>';
            return;
        }
        return res.json().then(renderRows);
    }).catch(function (err) {
        tbody.innerHTML = '<tr><td colspan="9" class="error">Ошибка сети: ' + escapeHtml(err.message || err) + '</td></tr>';
    });
}

// ---------- B15.3: create modal ----------

function showCreateError(msg) {
    var el = document.getElementById('createError');
    if (!msg) { el.textContent = ''; el.classList.remove('show'); return; }
    el.textContent = msg;
    el.classList.add('show');
}

function openCreateModal() {
    document.getElementById('cEmail').value = '';
    document.getElementById('cPassword').value = '';
    document.getElementById('cName').value = '';
    document.getElementById('cSpecialty').value = 'lor';
    document.getElementById('cRole').value = 'doctor';
    document.getElementById('cPhone').value = '';
    showCreateError('');

    // B15.3: только superadmin видит admin/superadmin в селекте
    var isSuper = (typeof BotMaxAuth.isSuperadmin === 'function') && BotMaxAuth.isSuperadmin();
    document.getElementById('optRoleAdmin').hidden = !isSuper;
    document.getElementById('optRoleSuper').hidden = !isSuper;
    document.getElementById('roleHint').style.display = isSuper ? 'none' : 'block';

    document.getElementById('modalCreate').classList.add('open');
}

function closeCreateModal() {
    document.getElementById('modalCreate').classList.remove('open');
}

function extractErr(res) {
    return res.text().then(function (t) {
        try {
            var j = JSON.parse(t);
            if (j && j.error) return j.error;
        } catch (e) {}
        return t || ('HTTP ' + res.status);
    });
}

function submitCreate() {
    var body = {
        email:     document.getElementById('cEmail').value.trim(),
        password:  document.getElementById('cPassword').value,
        name:      document.getElementById('cName').value.trim(),
        specialty: document.getElementById('cSpecialty').value.trim() || 'lor',
        role:      document.getElementById('cRole').value,
        phone:     document.getElementById('cPhone').value.trim()
    };

    if (!body.email || !body.password || !body.name) {
        showCreateError('email, password, name — обязательны');
        return;
    }

    var btn = document.getElementById('btnCreateSubmit');
    btn.disabled = true;
    showCreateError('');

    BotMaxAuth.authFetch('POST', '/api/doctors', body).then(function (res) {
        if (res.status === 201) {
            closeCreateModal();
            loadDoctors();
            return null;
        }
        return extractErr(res).then(function (msg) {
            showCreateError(msg);
        });
    }).catch(function (err) {
        showCreateError('Ошибка сети: ' + (err && err.message ? err.message : err));
    }).then(function () {
        btn.disabled = false;
    });
}

// ESC закрывает модалку (только create)
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
        var m = document.getElementById('modalCreate');
        if (m && m.classList.contains('open')) closeCreateModal();
    }
});

// ---------- B15.4: edit / toggle / delete ----------

function showTopError(msg) {
    var el = document.getElementById('topError');
    if (!msg) { el.textContent = ''; el.classList.remove('show'); return; }
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 6000);
}

function findRowById(id) {
    // ищем в текущем DOM по data-id? проще — перезапрашивать не будем,
    // берём данные из уже отрендеренной строки по id колонки.
    var rows = document.querySelectorAll('#tbody tr');
    for (var i = 0; i < rows.length; i++) {
        var firstCell = rows[i].querySelector('td.mono');
        if (firstCell && firstCell.textContent.trim() === id) {
            return rows[i];
        }
    }
    return null;
}

function showEditError(msg) {
    var el = document.getElementById('editError');
    if (!msg) { el.textContent = ''; el.classList.remove('show'); return; }
    el.textContent = msg;
    el.classList.add('show');
}

// храним полный объект последнего загруженного списка — чтобы edit знал поля
var lastDoctors = [];
var origRenderRows = renderRows;
renderRows = function (rows) {
    lastDoctors = rows || [];
    origRenderRows(rows);
};

function getDoctorById(id) {
    for (var i = 0; i < lastDoctors.length; i++) {
        if (lastDoctors[i].id === id) return lastDoctors[i];
    }
    return null;
}

function openEditModal(id) {
    var r = getDoctorById(id);
    if (!r) { showTopError('Доктор не найден в текущем списке'); return; }
    document.getElementById('eId').value = r.id;
    document.getElementById('eName').value = r.name || '';
    document.getElementById('eSpecialty').value = r.specialty || '';
    document.getElementById('ePhone').value = r.phone || '';
    document.getElementById('eActive').checked = !!r.active;
    showEditError('');

    // self: нельзя снять active
    var me = (typeof BotMaxAuth.getDoctor === 'function') ? BotMaxAuth.getDoctor() : null;
    var isSelf = me && me.id === r.id;
    var eActive = document.getElementById('eActive');
    eActive.disabled = isSelf;
    if (isSelf) eActive.checked = true;

    document.getElementById('modalEdit').classList.add('open');
}

function closeEditModal() {
    document.getElementById('modalEdit').classList.remove('open');
}

function submitEdit() {
    var id = document.getElementById('eId').value;
    if (!id) return;

    var body = {
        name:      document.getElementById('eName').value.trim(),
        specialty: document.getElementById('eSpecialty').value.trim(),
        phone:     document.getElementById('ePhone').value.trim()
    };
    var eActive = document.getElementById('eActive');
    if (!eActive.disabled) {
        body.active = !!eActive.checked;
    }

    var btn = document.getElementById('btnEditSubmit');
    btn.disabled = true;
    showEditError('');

    BotMaxAuth.authFetch('PATCH', '/api/doctors/' + encodeURIComponent(id), body).then(function (res) {
        if (res.ok) {
            closeEditModal();
            loadDoctors();
            return null;
        }
        return extractErr(res).then(function (msg) { showEditError(msg); });
    }).catch(function (err) {
        showEditError('Ошибка сети: ' + (err && err.message ? err.message : err));
    }).then(function () { btn.disabled = false; });
}

function toggleActive(id, makeActive) {
    var r = getDoctorById(id);
    if (!r) { showTopError('Доктор не найден'); return; }
    var verb = makeActive ? 'активировать' : 'деактивировать';
    if (!confirm('Вы уверены, что хотите ' + verb + ' ' + r.email + '?')) return;

    BotMaxAuth.authFetch('PATCH', '/api/doctors/' + encodeURIComponent(id), { active: !!makeActive })
        .then(function (res) {
            if (res.ok) { loadDoctors(); return; }
            return extractErr(res).then(function (msg) { showTopError(msg); });
        })
        .catch(function (err) { showTopError('Ошибка сети: ' + (err && err.message ? err.message : err)); });
}

function confirmDelete(id, email) {
    if (!confirm('УДАЛИТЬ доктора ' + email + '?\nДействие необратимо.')) return;

    BotMaxAuth.authFetch('DELETE', '/api/doctors/' + encodeURIComponent(id)).then(function (res) {
        if (res.ok) { loadDoctors(); return; }
        return extractErr(res).then(function (msg) { showTopError(msg); });
    }).catch(function (err) { showTopError('Ошибка сети: ' + (err && err.message ? err.message : err)); });
}

// ESC закрывает edit-модалку
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
        var m = document.getElementById('modalEdit');
        if (m && m.classList.contains('open')) closeEditModal();
    }
});

// Первая загрузка
// B20: вход «глазами доктора».
// POST /api/impersonation/start {doctor_id}. При успехе redirect в кабинет.
function impersonate(doctorId) {
    if (!confirm('Войти как этот доктор? Вы получите 15 минут в его кабинете.')) return;
    BotMaxAuth.authFetch('POST', '/api/impersonation/start', { doctor_id: doctorId })
        .then(function (res) {
            if (res.status === 403 || res.status === 401) {
                alert('Недостаточно прав или сессия истекла');
                return null;
            }
            if (!res.ok) {
                return res.json().then(function (d) {
                    alert('Ошибка: ' + (d.error || res.status));
                }).catch(function () {
                    alert('Ошибка: ' + res.status);
                });
            }
            return res.json().then(function (d) {
                // B24.1: оповещаем другие табы о старте impersonation.
                // (Сейчас никто не слушает, но полезно для будущего.)
                if (typeof BroadcastChannel !== 'undefined') {
                    try {
                        var ch = new BroadcastChannel('botmax-impersonation');
                        ch.postMessage({ type: 'started', target_id: d.target && d.target.id });
                        ch.close();
                    } catch (e) { /* silent */ }
                }
                window.location.href = 'doctor_cabinet.html';
            });
        })
        .catch(function (err) {
            alert('Ошибка сети: ' + (err.message || err));
        });
}

loadDoctors();
