<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал действий — BOT_MAX</title>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }

        .container { max-width: 1600px; margin: 0 auto; }

        .back-link {
            display: inline-block;
            color: #a0aec0;
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .back-link:hover { color: #fff; }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo {
            font-size: 2em;
            background: linear-gradient(135deg, #9f7aea, #667eea);
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .header-title h1 { font-size: 1.3em; color: #fff; }
        .header-title small { color: #a0aec0; font-size: 0.8em; }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-info    { background: #4299e1; color: #fff; }
        .btn-danger  { background: #e53e3e; color: #fff; }
        .btn-success { background: #38a169; color: #fff; }
        .btn-secondary { background: #4a5568; color: #e2e8f0; }

        .filters {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 0.85em; color: #a0aec0; }
        .field input, .field select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
            color: #e2e8f0;
            font-size: 0.9em;
            min-width: 160px;
        }
        .field input:focus, .field select:focus { outline: 1px solid #667eea; }

        .table-wrap {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            vertical-align: top;
        }
        th { color: #a0aec0; font-weight: 600; user-select: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }
        td.mono { font-family: 'Consolas', monospace; font-size: 0.85em; color: #cbd5e0; }
        .action-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            font-family: 'Consolas', monospace;
            background: rgba(102, 126, 234, 0.2);
            color: #a3bffa;
        }
        .action-badge.auth  { background: rgba(56, 161, 105, 0.2); color: #9ae6b4; }
        .action-badge.doctor { background: rgba(214, 158, 46, 0.2); color: #fbd38d; }
        .action-badge.patient { background: rgba(159, 122, 234, 0.2); color: #d6bcfa; }

        .empty { text-align: center; color: #718096; padding: 40px; font-style: italic; }
        .error { color: #fc8181; padding: 20px; text-align: center; }
        .count { color: #a0aec0; font-size: 0.85em; margin-left: 10px; }
    </style>
</head>
<body>
<script>
// B13.1: страница только для admin/superadmin
(function(){
    if (typeof BotMaxAuth === "undefined") {
        window.location.replace("login.html");
        return;
    }
    if (!BotMaxAuth.isLoggedIn()) {
        window.location.replace("login.html");
        return;
    }
    if (!BotMaxAuth.isAdmin()) {
        window.location.replace("doctor_cabinet.html");
        return;
    }
})();
</script>

<div class="container">
    <a href="admin_panel.html" class="back-link">⬅ Назад в панель</a>

    <div class="header">
        <div class="header-left">
            <div class="logo">📜</div>
            <div class="header-title">
                <h1>Журнал действий</h1>
                <small>Audit-log системы BOT_MAX</small>
            </div>
        </div>
        <div>
            <button class="btn btn-info" onclick="loadAudit()">🔄 Обновить</button>
            <a href="admin_panel.html" class="btn btn-secondary">↩ В панель</a>
        </div>
    </div>

    <div class="filters">
        <div class="field">
            <label for="fAction">Action</label>
            <input id="fAction" type="text" placeholder="auth.login, doctor.create…">
        </div>
        <div class="field">
            <label for="fDoctor">Doctor ID</label>
            <input id="fDoctor" type="text" placeholder="ADMIN-001, DOC-001…">
        </div>
        <div class="field">
            <label for="fSince">Since</label>
            <input id="fSince" type="date">
        </div>
        <div class="field">
            <label for="fLimit">Limit</label>
            <select id="fLimit">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <button class="btn btn-success" onclick="loadAudit()">🔍 Применить</button>
        <button class="btn btn-secondary" onclick="resetFilters()">✖ Сбросить</button>
    </div>

    <div class="table-wrap">
        <div class="count" id="countLabel"></div>
        <table>
            <thead>
                <tr>
                    <th style="width:50px">#</th>
                    <th style="width:150px">Время (UTC)</th>
                    <th style="width:120px">Doctor</th>
                    <th style="width:180px">Action</th>
                    <th style="width:90px">Entity</th>
                    <th style="width:170px">Entity ID</th>
                    <th style="width:120px">IP</th>
                    <th>Detail</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="8" class="empty">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function actionClass(action) {
    if (!action) return '';
    if (action.indexOf('auth.') === 0) return 'auth';
    if (action.indexOf('doctor.') === 0) return 'doctor';
    if (action.indexOf('patient.') === 0) return 'patient';
    return '';
}

function buildQuery() {
    var params = [];
    var a  = document.getElementById('fAction').value.trim();
    var d  = document.getElementById('fDoctor').value.trim();
    var s  = document.getElementById('fSince').value;
    var l  = document.getElementById('fLimit').value;
    if (a)  params.push('action=' + encodeURIComponent(a));
    if (d)  params.push('doctor_id=' + encodeURIComponent(d));
    if (s)  params.push('since=' + encodeURIComponent(s));
    if (l)  params.push('limit=' + encodeURIComponent(l));
    return params.length ? ('?' + params.join('&')) : '';
}

function renderRows(rows) {
    var tbody = document.getElementById('tbody');
    var count = document.getElementById('countLabel');

    if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">Пусто — записей нет</td></tr>';
        count.textContent = 'Найдено: 0';
        return;
    }
    var html = '';
    for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        html += '<tr>';
        html += '<td class="mono">' + r.id + '</td>';
        html += '<td class="mono">' + escapeHtml(r.ts) + '</td>';
        html += '<td class="mono">' + escapeHtml(r.doctorId) + '</td>';
        html += '<td><span class="action-badge ' + actionClass(r.action) + '">' + escapeHtml(r.action) + '</span></td>';
        html += '<td>' + escapeHtml(r.entity) + '</td>';
        html += '<td class="mono">' + escapeHtml(r.entityId) + '</td>';
        html += '<td class="mono">' + escapeHtml(r.ip) + '</td>';
        html += '<td class="mono">' + escapeHtml(r.detail) + '</td>';
        html += '</tr>';
    }
    tbody.innerHTML = html;
    count.textContent = 'Найдено: ' + rows.length;
}

function loadAudit() {
    var url = '/api/audit' + buildQuery();
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '<tr><td colspan="8" class="empty">Загрузка…</td></tr>';

    BotMaxAuth.authFetch('GET', url).then(function (res) {
        if (!res.ok) {
            tbody.innerHTML = '<tr><td colspan="8" class="error">Ошибка ' + res.status + '</td></tr>';
            return;
        }
        return res.json().then(renderRows);
    }).catch(function (err) {
        tbody.innerHTML = '<tr><td colspan="8" class="error">Ошибка сети: ' + escapeHtml(err.message || err) + '</td></tr>';
    });
}

function resetFilters() {
    document.getElementById('fAction').value = '';
    document.getElementById('fDoctor').value = '';
    document.getElementById('fSince').value  = '';
    document.getElementById('fLimit').value  = '100';
    loadAudit();
}

// Первая загрузка
loadAudit();
</script>
</body>
</html>
