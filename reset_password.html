<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новый пароль — BOT_MAX</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        background: rgba(26,32,44,0.85);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 40px 36px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 8px; font-size: 1.5em; }
    .subtitle { color: #a0aec0; font-size: 0.9em; margin-bottom: 28px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9em; color: #cbd5e0; }
    input[type=password] {
        width: 100%; padding: 12px 14px; border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.05);
        color: #e2e8f0; font-size: 1em;
        margin-bottom: 18px;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
        width: 100%; padding: 13px; border: 0; border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff; font-size: 1em; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg {
        margin-top: 18px; padding: 12px 14px; border-radius: 10px;
        font-size: 0.9em; display: none;
    }
    .msg.ok  { background: rgba(72,187,120,0.15); border: 1px solid #48bb78; color: #9ae6b4; display: block; }
    .msg.err { background: rgba(245,101,101,0.15); border: 1px solid #f56565; color: #fc8181; display: block; }
    a.back { display: inline-block; margin-top: 20px; color: #a0aec0; font-size: 0.9em; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
    <h1>🆕 Новый пароль</h1>
    <p class="subtitle">Придумайте новый пароль (не менее 8 символов).</p>

    <form id="resetForm" autocomplete="off">
        <label for="password">Новый пароль</label>
        <input type="password" id="password" name="new_password" required minlength="8" autofocus>
        <label for="password2">Повторите пароль</label>
        <input type="password" id="password2" name="confirm_password" required minlength="8">
        <button type="submit" id="submitBtn">Сохранить пароль</button>
    </form>

    <div id="msg" class="msg"></div>

    <a href="login.html" class="back">← Ко входу</a>
</div>

<script src="auth.js"></script>
<script>
(function () {
    'use strict';
    var form = document.getElementById('resetForm');
    var passEl = document.getElementById('password');
    var pass2El = document.getElementById('password2');
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');

    function show(kind, text) {
        msg.className = 'msg ' + kind;
        msg.textContent = text;
    }

    // Токен из URL.
    var urlParams = new URLSearchParams(window.location.search);
    var token = urlParams.get('token');
    if (!token) {
        show('err', 'В ссылке отсутствует токен. Запросите новую ссылку.');
        btn.disabled = true;
        return;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (passEl.value !== pass2El.value) {
            show('err', 'Пароли не совпадают');
            return;
        }
        if (passEl.value.length < 8) {
            show('err', 'Пароль должен быть не менее 8 символов');
            return;
        }
        btn.disabled = true;
        btn.textContent = 'Сохранение…';
        msg.className = 'msg';

        fetch('/api/auth/password-reset/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, new_password: passEl.value })
        }).then(function (res) {
            return res.json().then(function (d) { return { ok: res.ok, data: d }; });
        }).then(function (r) {
            if (!r.ok) {
                btn.disabled = false;
                btn.textContent = 'Сохранить пароль';
                show('err', (r.data && r.data.error) || 'Ошибка');
                return;
            }
            show('ok', 'Пароль изменён! Сейчас перенаправим на вход…');
            setTimeout(function () {
                window.location.href = 'login.html';
            }, 1200);
        }).catch(function () {
            btn.disabled = false;
            btn.textContent = 'Сохранить пароль';
            show('err', 'Сервер недоступен');
        });
    });
})();
</script>
</body>
</html>
