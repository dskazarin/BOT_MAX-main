<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Смена пароля — BOT_MAX</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        background: rgba(26,32,44,0.85);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 40px 36px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 8px; font-size: 1.5em; }
    .subtitle { color: #a0aec0; font-size: 0.9em; margin-bottom: 28px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9em; color: #cbd5e0; }
    input[type=password] {
        width: 100%; padding: 12px 14px; border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.05);
        color: #e2e8f0; font-size: 1em;
        margin-bottom: 18px;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
        width: 100%; padding: 13px; border: 0; border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff; font-size: 1em; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg {
        margin-top: 18px; padding: 12px 14px; border-radius: 10px;
        font-size: 0.9em; display: none;
    }
    .msg.ok  { background: rgba(72,187,120,0.15); border: 1px solid #48bb78; color: #9ae6b4; display: block; }
    .msg.err { background: rgba(245,101,101,0.15); border: 1px solid #f56565; color: #fc8181; display: block; }
    .banner {
        background: rgba(246,173,85,0.15); border: 1px solid #f6ad55;
        color: #fbd38d; padding: 12px 14px; border-radius: 10px;
        font-size: 0.9em; margin-bottom: 20px;
    }
</style>
</head>
<body>
<div class="card">
    <div class="banner">⚠️ Требуется сменить пароль перед продолжением работы.</div>
    <h1>🔒 Смена пароля</h1>
    <p class="subtitle">Введите текущий и новый пароль.</p>

    <form id="changeForm" autocomplete="off">
        <label for="old_password">Текущий пароль</label>
        <input type="password" id="old_password" required autofocus>
        <label for="password">Новый пароль (не менее 8 символов)</label>
        <input type="password" id="password" required minlength="8">
        <label for="password2">Повторите новый пароль</label>
        <input type="password" id="password2" required minlength="8">
        <button type="submit" id="submitBtn">Сменить пароль</button>
    </form>

    <div id="msg" class="msg"></div>
</div>

<script src="auth.js"></script>
<script>
(function () {
    'use strict';

    // Если не залогинен — редирект на login.
    if (typeof BotMaxAuth === 'undefined' || !BotMaxAuth.isLoggedIn()) {
        window.location.replace('login.html');
        return;
    }

    var form = document.getElementById('changeForm');
    var oldEl = document.getElementById('old_password');
    var passEl = document.getElementById('password');
    var pass2El = document.getElementById('password2');
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');

    function show(kind, text) {
        msg.className = 'msg ' + kind;
        msg.textContent = text;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (passEl.value !== pass2El.value) {
            show('err', 'Новые пароли не совпадают');
            return;
        }
        if (passEl.value.length < 8) {
            show('err', 'Пароль должен быть не менее 8 символов');
            return;
        }
        btn.disabled = true;
        btn.textContent = 'Сохранение…';

        BotMaxAuth.authFetch('POST', '/api/auth/change-password', {
            old_password: oldEl.value,
            new_password: passEl.value
        }).then(function (res) {
            return res.json().then(function (d) { return { status: res.status, ok: res.ok, data: d }; });
        }).then(function (r) {
            if (!r.ok) {
                btn.disabled = false;
                btn.textContent = 'Сменить пароль';
                if (r.status === 401) {
                    show('err', 'Текущий пароль неверен');
                    oldEl.value = '';
                    oldEl.focus();
                } else {
                    show('err', (r.data && r.data.error) || 'Ошибка');
                }
                return;
            }
            show('ok', 'Пароль изменён! Перенаправление…');
            setTimeout(function () {
                window.location.href = 'doctor_cabinet.html';
            }, 1000);
        }).catch(function () {
            btn.disabled = false;
            btn.textContent = 'Сменить пароль';
            show('err', 'Сервер недоступен');
        });
    });

})();
</script>
</body>
</html>
